<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/bootstrap.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/index.responsive.css" />
  </head>
  <body>
    <section id="Filter" class="py-5">
      <div class="container">
        <form>
            <div class="row">
              <div class="col-lg-6">
                <div class="item">
                  <div class="mb-3">
                    <label for="Category" class="form-label text-light fw-bolder">Category</label>
                    <select class="form-control" name="" id="Category">
                      <option value="business" selected>Business</option>
                      <option value="health">Health</option>
                      <option value="science">Science</option>
                      <option value="sports">Sports</option>
                      <option value="technology">Technology</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="item">
                  <div class="mb-3">
                    <label for="Search" class="form-label text-light fw-bolder">Search</label>
                    <input type="text" class="form-control" id="Search" />
                  </div>
                </div>
              </div>
            </div>
            <button class="btn btn-success w-100 mt-3"> Filter</button>
        </form>
      </div>
    </section>

    <section id="Data" class="py-5">
      <div class="container">
        <div class="row"></div>
        <nav class="mt-5">
          <ul class="pagination justify-content-center"></ul>
        </nav>
      </div>
    </section>

    <script src="./js/jQuery.js"></script>
    <script src="./js/functions.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
